name: Build OpenWrt (bnx2x 2.5G)

on:
  workflow_dispatch:      # manual trigger: Actions → Run workflow
  push:
    branches: [ main ]
  schedule:               # optional: auto-rebuild every Monday 2 AM
    - cron: '0 2 * * 1'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl

      - name: Clone official OpenWrt (point-release branch = auto-updates)
        run: |
          git clone -b openwrt-25.12 --depth 1 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply bnx2x 2.5G driver patch
        run: |
          cd openwrt
          PATCH_DIR=$(ls -d target/linux/x86/patches-* | tail -n 1)
          curl -L "https://raw.githubusercontent.com/zhinengzi/linux6.x-bnx2x-2.5g-patch/refs/heads/main/linux6.x-bnx2x-2.5g.patch" \
               -o "$PATCH_DIR/999-linux6.x-bnx2x-2.5g.patch"
          echo "===> Patch injected into $PATCH_DIR <==="

      - name: Configure
        run: |
          cd openwrt
          cp "$GITHUB_WORKSPACE/openwrt.config" .config
          make defconfig

      - name: Build
        run: |
          cd openwrt
          make -j$(nproc) 2>&1 | tail -120

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86-64-2.5g
          path: |
            openwrt/bin/targets/x86/64/*combined*.img.gz
            openwrt/bin/targets/x86/64/sha256sums
